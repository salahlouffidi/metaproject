name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: find extension server -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test URL signals
        run: node --test server/test/*.test.js
